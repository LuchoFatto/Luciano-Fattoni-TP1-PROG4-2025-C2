<header class="w-full bg-gray-900 bg-opacity-80 shadow-md fixed top-0 left-0 z-50">
    <nav class="w-full flex items-center justify-between px-8 py-3">
        <span class="font-bold text-xl text-blue-200 tracking-wide">Sala de Juegos</span>
        <div class="flex gap-4 items-center">
            @if (supabaseServices.usuarioActual()) {
            <a routerLink="/results" class="text-gray-200 hover:text-blue-400 font-medium transition">Tabla Puntajes</a>
            <a routerLink="/games" class="text-gray-200 hover:text-blue-400 font-medium transition">Games</a>
            <a routerLink="/profile" class="text-gray-200 hover:text-blue-400 font-medium transition">Quién soy</a>
            <span class="text-blue-300 font-semibold user-name">{{ supabaseServices.userName }}</span>
            <button (click)="cerrarSesion()"
                class="text-white bg-red-600 hover:bg-red-700 rounded px-3 py-1 font-medium transition flex-shrink-0">Cerrar
                sesión</button>
            } @else {
            <a routerLink="/results" class="text-gray-200 hover:text-blue-400 font-medium transition">Tabla Puntajes</a>
            <a routerLink="/home" class="text-gray-200 hover:text-blue-400 font-medium transition">Home</a>
            <a routerLink="/login" class="text-gray-200 hover:text-blue-400 font-medium transition">Login</a>
            <a routerLink="/register" class="text-gray-200 hover:text-blue-400 font-medium transition">Registrarse</a>
            <a routerLink="/profile" class="text-gray-200 hover:text-blue-400 font-medium transition">Quién soy</a>
            }
        </div>
    </nav>
</header>

<router-outlet></router-outlet>
