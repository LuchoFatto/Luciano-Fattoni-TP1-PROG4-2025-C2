<app-background>
    <form class="w-full max-w-lg bg-gray-900 bg-opacity-40 p-10 rounded-lg shadow-lg text-white flex flex-col items-center">
        <h2 class="text-2xl font-bold mb-6 text-center w-full">Registro</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5 w-full">
            <div>
                <label for="nombre" class="block mb-2 text-sm font-medium text-white text-center md:text-left">Nombre</label>
                <input type="text" id="nombre" name="nombre"
                    class="bg-gray-800 bg-opacity-60 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 placeholder-gray-300 text-center md:text-left"
                    placeholder="Tu nombre" required />
            </div>
            <div>
                <label for="apellido" class="block mb-2 text-sm font-medium text-white text-center md:text-left">Apellido</label>
                <input type="text" id="apellido" name="apellido"
                    class="bg-gray-800 bg-opacity-60 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 placeholder-gray-300 text-center md:text-left"
                    placeholder="Tu apellido" required />
            </div>
        </div>
        <div class="mb-5 w-full">
            <label for="edad" class="block mb-2 text-sm font-medium text-white text-center md:text-left">Edad</label>
            <input type="number" id="edad" name="edad" min="0" max="120"
                class="bg-gray-800 bg-opacity-60 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 placeholder-gray-300 text-center md:text-left"
                placeholder="Tu edad" required />
        </div>
        <div class="mb-5 w-full">
            <label for="email" class="block mb-2 text-sm font-medium text-white text-center md:text-left">Correo electrónico</label>
            <input type="email" id="email" name="email"
                class="bg-gray-800 bg-opacity-60 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 placeholder-gray-300 text-center md:text-left"
                placeholder="ejemplo@email.com" required />
        </div>
        <div class="mb-5 w-full">
            <label for="password" class="block mb-2 text-sm font-medium text-white text-center md:text-left">Contraseña</label>
            <input type="password" id="password" name="password"
                class="bg-gray-800 bg-opacity-60 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 placeholder-gray-300 text-center md:text-left"
                required />
        </div>
        <div class="mb-8 w-full">
            <label for="repeat_password" class="block mb-2 text-sm font-medium text-white text-center md:text-left">Repetir contraseña</label>
            <input type="password" id="repeat_password" name="repeat_password"
                class="bg-gray-800 bg-opacity-60 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 placeholder-gray-300 text-center md:text-left"
                required />
        </div>
        <button type="submit"
            class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full px-5 py-2.5 text-center">Registrarse</button>
    </form>
</app-background>
